name: ICP checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feature/icp-web3]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check:motoko
      - run: npm run build

      - name: Install canonical ICP toolchain
        run: npm install --global @icp-sdk/icp-cli@1.2.0 @icp-sdk/ic-wasm@0.11.0 ic-mops@2.19.2

      - run: mops install --lock check
      - run: mops check backend
      - run: icp project show

      - name: Build self-contained ICP deployment bundle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: icp project bundle --output nak-staging.icp

      - name: Upload staging deployment bundle
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nak-staging-${{ github.sha }}
          path: |
            nak-staging.icp
            mops.lock
          if-no-files-found: error
          retention-days: 14
